name: Test and screenshot scenario
on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'web/**'
      - 'calculator.py'
      - 'tests/**'
      - '.github/workflows/verify.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenario:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install streamlit pytest playwright
      - run: python -m pytest -q
      - name: Verify dependency-free offline web application
        run: node --test tests/offline_web.test.mjs
      - name: Start actual Streamlit app
        run: |
          streamlit run "app.py" --server.headless true --server.address 127.0.0.1 --server.port 8501 --browser.gatherUsageStats false > /tmp/streamlit.log 2>&1 &
          for i in {1..20}; do if curl -fsS http://127.0.0.1:8501/_stcore/health; then exit 0; fi; sleep 1; done
          cat /tmp/streamlit.log
          exit 1
      - name: Capture fully rendered app with browser wait
        run: python scripts/capture_streamlit.py
      - uses: actions/upload-artifact@v4
        with:
          name: scenario-screenshot
          path: docs/screenshots/scenario-desktop.png