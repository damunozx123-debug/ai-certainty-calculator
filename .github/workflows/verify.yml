name: Test and screenshot scenario
on:
  push:
    branches: [main]
    paths:
      - 'App. Py'
      - 'calculator.py'
      - 'tests/**'
      - '.github/workflows/verify.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scenario:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install streamlit pytest
      - run: python -m pytest -q
      - name: Start actual Streamlit app
        run: |
          streamlit run "App. Py" --server.headless true --server.address 127.0.0.1 --server.port 8501 --browser.gatherUsageStats false > /tmp/streamlit.log 2>&1 &
          for i in {1..20}; do if curl -fsS http://127.0.0.1:8501/_stcore/health; then exit 0; fi; sleep 1; done
          cat /tmp/streamlit.log
          exit 1
      - name: Capture browser screenshot
        run: |
          mkdir -p docs/screenshots
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --virtual-time-budget=6000 --window-size=1380,900 --screenshot="$PWD/docs/screenshots/scenario-desktop.png" http://127.0.0.1:8501/
          test -s docs/screenshots/scenario-desktop.png
      - uses: actions/upload-artifact@v4
        with:
          name: scenario-screenshot
          path: docs/screenshots/scenario-desktop.png
      - name: Publish screenshot
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/scenario-desktop.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: actual Streamlit scenario screenshot [skip ci]"
            git push origin HEAD:main
          fi
